name: CI

# Gate 0 CI. Every job runs the same commands a developer runs locally
# (scripts/check.ps1 carries the canonical command list).
#
# Runner and action versions are pinned deliberately and were verified on
# 2026-11-27:
#   - windows-latest resolves to Windows Server 2025 (build 10.0.26100) with
#     Windows SDK 10.0.26100.0. `windows-2025` is pinned explicitly so the
#     image does not drift under us.
#   - GitHub's windows-2025 image ships Visual Studio 2022 17.14 (and a
#     separate windows-2025-vs2026 image ships VS 2026 18.12). Both satisfy
#     the MSVC toolset Rust and Tauri need; the 2019 toolset does not.
#
# actions/checkout, actions/setup-node, codecov/codecov-action and
# cargo-deny-action are all at majors newer than the commonly cited v4/v5.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Warnings are errors. Never suppress a warning to force a green build.
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------- format + lint
  lint:
    name: format and lint (windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ------------------------------------------------------------------- test
  test:
    name: test (windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Gate 0 deferred-crate guard
        shell: pwsh
        run: |
          $deferred = @(
            'crates/dd-audio','crates/dd-dsp','crates/dd-analysis',
            'crates/dd-renderer','crates/dd-package','crates/dd-steam',
            'crates/dd-desktop-automation'
          )
          $present = @($deferred | Where-Object { Test-Path $_ })
          if ($present.Count -gt 0) {
            Write-Host "Deferred crates present at Gate 0: $($present -join ', ')"
            exit 1
          }
          if (Test-Path 'crates/dd-platform/src/windows') {
            Write-Host 'crates/dd-platform/src/windows exists before Gate 3'
            exit 1
          }

      - name: cargo test
        run: cargo test --workspace --all-features

  # ------------------------------------------------------------------- build
  build:
    name: build (windows)
    runs-on: windows-2025
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.100.0
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: cargo build --release
        run: cargo build --workspace --release

      - name: Upload engine binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: discodesk-engine-windows
          path: target/release/discodesk-engine.exe
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------- dependency policy
  # Licence and advisory gate. A separate job so a policy failure is
  # distinguishable from a code failure. deny.toml is the single source of
  # truth for the policy.
  #
  # NOTE: EmbarkStudios/cargo-deny-action is a Docker container action, and
  # Docker actions do not run on Windows runners. cargo-deny is therefore
  # installed with cargo and invoked directly. The audit runs on Windows so the
  # resolved graph is the one we actually ship.
  audit:
    name: dependency audit
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.100.0
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.22.1

      - name: cargo deny check all
        run: cargo deny check all
