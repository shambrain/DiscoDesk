name: CI

# Every job runs the same commands a developer runs locally; `scripts/check.ps1`
# carries the canonical list.
#
# Runner and action versions were verified on 2026-11-27:
#   * `windows-2025-vs2026` is the GitHub image that pairs Windows Server 2025
#     with Visual Studio 2026, which is what this repository targets.
#   * `actions/checkout@v7`, `actions/setup-node@v7`, `actions/upload-artifact@v7`,
#     `actions/download-artifact@v8`, `Swatinem/rust-cache@v2` are the current
#     majors.
#
# The Studio frontend is built in its own job and shared as an artefact because
# `tauri-build` embeds `frontendDist` at compile time: every Rust job needs it,
# and building it three times would be wasteful.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Warnings are errors for workspace crates through [workspace.lints], and
  # clippy is invoked with `-D warnings`. A global RUSTFLAGS is deliberately not
  # used: it would also apply to third-party crates and make the build fail on
  # code we do not own.

jobs:
  # ------------------------------------------------------------ studio frontend
  frontend:
    name: studio frontend (typecheck, test, build)
    runs-on: windows-2025-vs2026
    defaults:
      run:
        working-directory: apps/discodesk-studio
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/discodesk-studio/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: typecheck
        run: npm run typecheck

      - name: frontend tests
        run: npm test

      - name: production build
        run: npm run build

      - name: Upload studio frontend
        uses: actions/upload-artifact@v7.0.2
        with:
          name: studio-dist
          path: apps/discodesk-studio/dist
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------- format + lint
  lint:
    name: format and lint (windows)
    runs-on: windows-2025-vs2026
    needs: [frontend]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Restore studio frontend
        uses: actions/download-artifact@v8.0.2
        with:
          name: studio-dist
          path: apps/discodesk-studio/dist

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Verify Visual Studio 2026 MSVC environment
        shell: pwsh
        run: ./scripts/vs/Invoke-DiscoDeskVS.ps1 -Action Doctor

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ------------------------------------------------------------------- test
  test:
    name: test (windows)
    runs-on: windows-2025-vs2026
    needs: [frontend]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Restore studio frontend
        uses: actions/download-artifact@v8.0.2
        with:
          name: studio-dist
          path: apps/discodesk-studio/dist

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Gate 0 deferred-crate guard
        shell: pwsh
        run: |
          $deferred = @(
            'crates/dd-analysis',
            'crates/dd-renderer','crates/dd-package','crates/dd-steam',
            'crates/dd-desktop-automation'
          )
          $present = @($deferred | Where-Object { Test-Path $_ })
          if ($present.Count -gt 0) {
            Write-Host "Deferred crates present before their gate: $($present -join ', ')"
            exit 1
          }
          if (Test-Path 'crates/dd-platform/src/windows') {
            Write-Host 'crates/dd-platform/src/windows exists before Gate 3'
            exit 1
          }

      - name: cargo test
        run: cargo test --workspace --all-features

  # ------------------------------------- release build, Tauri build, IPC smoke
  # Both real binaries are produced here so the smoke test can prove they talk
  # to each other, rather than only that each compiles.
  build:
    name: build and verify processes (windows)
    runs-on: windows-2025-vs2026
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Restore studio frontend
        uses: actions/download-artifact@v8.0.2
        with:
          name: studio-dist
          path: apps/discodesk-studio/dist

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.100.0
          targets: x86_64-pc-windows-msvc

      - name: Install Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: cargo build --release
        run: cargo build --workspace --release

      - name: Tauri Windows build (Studio)
        working-directory: apps/discodesk-studio
        run: |
          npm ci --no-audit --no-fund
          npx tauri build

      # Starts the real engine, drives the real protocol, and runs the real
      # Studio binary's --probe against it.
      - name: IPC smoke test
        shell: pwsh
        run: ./scripts/ipc-smoke.ps1 -Configuration release

      # Launches the actual GUI and proves the engine survives the Studio
      # closing (the ADR-0001 invariant no unit test can show).
      - name: Studio launch smoke test
        shell: pwsh
        run: ./scripts/studio-smoke.ps1 -Configuration release

      - name: Upload engine binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: discodesk-engine-windows
          path: target/release/discodesk-engine.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Studio binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: discodesk-studio-windows
          path: target/release/discodesk-studio.exe
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------- dependency policy
  # Licence and advisory gate. A separate job so a policy failure is
  # distinguishable from a code failure. deny.toml is the single source of truth.
  #
  # NOTE: EmbarkStudios/cargo-deny-action is a Docker container action, and Docker
  # actions do not run on Windows runners, so cargo-deny is installed with cargo.
  audit:
    name: dependency audit
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.100.0
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.22.1

      - name: cargo deny check all
        run: cargo deny check all
