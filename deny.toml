# cargo-deny configuration for the DiscoDesk workspace.
#
# Schema target: cargo-deny 0.22.1 (pinned in CI). This file is validated by
# `cargo deny check all`, not by inspection.
#
# Schema notes that matter, because the older field names silently break:
#   * `[licenses] deny` was REMOVED. The licenses check is deny-by-default:
#     anything not in `allow` fails. The refusal policy for GPL/AGPL/LGPL and
#     the non-commercial Creative Commons licenses is therefore expressed by
#     their *absence* from `allow`, and is documented in the comment below.
#   * `[licenses] unknown` was REMOVED. An unlicensed crate is a hard failure.
#   * `[advisories] unmaintained` and `[advisories] unsound` take a SCOPE
#     (`all` | `workspace` | `transitive` | `none`), not a lint level.
#   * `version` in `[licenses]` / `[advisories]` is no longer used.

[graph]
# Evaluate every feature so a license cannot hide behind an optional dependency.
all-features = true
no-default-features = false

[output]
feature-depth = 1

[licenses]
# The complete allow list. A license that is not here is refused, including:
#   AGPL-3.0*, GPL-2.0*, GPL-3.0*, LGPL-2.1*, LGPL-3.0*, CDDL-1.0/1.1,
#   EPL-1.0/2.0, OSL-3.0, SSPL-1.0, and every CC-BY-NC* variant.
#
# `0BSD` is required because several crates are published as
# `0BSD OR Apache-2.0` and cargo-deny evaluates each alternative.
#
# `MPL-2.0` is weak, file-level copyleft: it is allowed, and any MPL file
# linked into a shipped binary must be disclosed in THIRD_PARTY_NOTICES.md and
# its modifications published. No MPL crate is in the current graph.
#
# The GNU licenses are matched pedantically by cargo-deny (0.18.4+): a crate
# declaring `GPL-3.0` does not match `GPL-3.0-only`. None are allowed here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]

# `clarify` entries are per-crate SPDX overrides, not a list of identifiers.
# No crate currently needs one; the field is kept so the shape is explicit.
clarify = []

# No per-crate license exceptions. Everything must satisfy the global allow
# list; an exception is a deliberate, reviewed addition.
exceptions = []

# Dev-dependencies are reviewed too: CI installs and runs them.
include-dev = true

# `unused-allowed-license = "warn"` (default) reports an allow-list entry that
# no crate uses, so the list cannot drift. It warns rather than fails because a
# license can legitimately be listed ahead of a dependency that needs it.
unused-allowed-license = "warn"

[licenses.private]
# The workspace crates are unpublished and have no SPDX license yet (see
# LICENSE and docs/GATE0_PLAN.md D1). Exempting them keeps the dependency
# policy focused on what is actually redistributed; it does not grant the
# project a license.
ignore = true

[bans]
# Duplicate versions are reported, not refused: the graph legitimately needs
# more than one version of a few transitive crates. Making this an error would
# force pinning decisions that belong to the crates that depend on them.
multiple-versions = "warn"
# A `*` version requirement makes a build non-reproducible.
wildcards = "deny"
deny = []
allow = []
skip = []
skip-tree = []

[advisories]
# RustSec advisory database (the default source).
#
# Minimum fixed versions the resolved Cargo.lock must satisfy:
#   tracing-subscriber >= 0.3.20   (RUSTSEC-2025-0055, ANSI-escape log poisoning)
#   anyhow           >= 1.0.103    (RUSTSEC-2026-0190)  - not used
#   bytes            >= 1.11.1                          - not used
#   tokio            >= 1.54.1                          - not used at Gate 0
#   tauri            >= 2.11.1     (CVE-2026-42184)     - Studio crate
#
# A yanked version is an error: it is never a valid pin.
yanked = "deny"

# Unmaintained crates fail only when they are a direct dependency of a
# workspace crate. That is the scope we can actually act on: a direct
# dependency can be replaced, whereas a four-levels-deep transitive crate is
# the responsibility of whatever depends on it. This is a deliberate scope, not
# a silent downgrade.
unmaintained = "workspace"

# Unsoundness fails for ANY crate in the graph, direct or transitive. An
# unsound API is a correctness and security hazard regardless of who pulls it
# in, so this is deliberately stricter than the default `workspace` scope.
unsound = "all"

# Ignored advisories would still be printed as notes; nothing is ignored today.
ignore = []

# Fail if an entry in `ignore` stops matching anything, so a stale waiver
# cannot silently persist.
unused-ignored-advisory = "deny"

[sources]
# Only crates.io. A git or alternative-registry dependency would be an
# unreviewed supply-chain path and must be an explicit, reviewed change.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
