# Clippy configuration for the DiscoDesk workspace.
#
# Only keys that are valid for this Clippy version may appear here. An unknown
# key is a hard error ("unknown field name"), not a warning, so this file is
# kept deliberately small. Lint *selection* lives in `[workspace.lints]` in the
# root `Cargo.toml`; this file only carries values.

# Must stay in sync with `rust-version` in the workspace `Cargo.toml`.
msrv = "1.100.0"

# The engine is a background process; large enum variants are a real
# allocation concern, so this is tuned down from the default.
enum-variant-size-threshold = 64
