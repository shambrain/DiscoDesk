[workspace]
resolver = "3"
members = [
    "apps/discodesk-engine",
    "apps/discodesk-telemetry",
    "apps/discodesk-studio/src-tauri",
    "crates/dd-audio",
    "crates/dd-core",
    "crates/dd-diagnostics",
    "crates/dd-dsp",
    "crates/dd-ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
# The project license has NOT been decided yet. `license-file` is used instead of
# an SPDX `license` identifier so that no unverified license grant is implied
# by the manifest. See LICENSE and docs/ADR/.
license-file = "LICENSE"
repository = "https://github.com/DiscoDesk/DiscoDesk"
authors = ["DiscoDesk contributors"]

[workspace.dependencies]
# Shared, pinned dependency versions. Every entry is verified on crates.io and
# tracked in THIRD_PARTY_NOTICES.md.
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "std",
    "fmt",
    "registry",
    "ansi",
    "env-filter",
] }
tracing-appender = { version = "0.2.5", default-features = false }
clap = { version = "4.6.10", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
windows = { version = "0.62.2", default-features = false, features = [
    "std",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    # Audio capture (Gate 1)
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
] }

# Tauri v2 (Studio shell only). Versions verified against crates.io on
# 2026-11-27; see RESEARCH.md §16.3. Default features are kept because the
# desktop shell needs the `wry` webview backend.
tauri = { version = "2.12.7" }
tauri-build = { version = "2.7.6" }

# Intra-workspace crates.
#
# `version` is declared alongside `path` deliberately: a path dependency with no
# version is an implicit `*` requirement, which cargo-deny correctly rejects as
# a wildcard. Keeping the version explicit also documents the intended version
# of the dependency rather than leaving it implicit.
dd-audio = { path = "crates/dd-audio", version = "0.1.0" }
dd-core = { path = "crates/dd-core", version = "0.1.0" }
dd-diagnostics = { path = "crates/dd-diagnostics", version = "0.1.0" }
dd-dsp = { path = "crates/dd-dsp", version = "0.1.0" }
dd-ipc = { path = "crates/dd-ipc", version = "0.1.0" }

[workspace.lints.rust]
# `unsafe_op_in_unsafe_fn` keeps every unsafe block explicit inside unsafe fns.
unsafe_op_in_unsafe_fn = "deny"
# Warnings are errors for every workspace crate, so a local `cargo build` fails
# exactly where CI does. This is scoped by the `[lints]` table, which Cargo
# applies to workspace members only: third-party crates are never affected.
warnings = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Pedantic is enabled crate-by-crate; see the per-crate `lints` tables.
# The following are always on for this workspace.
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
# Deterministic, reviewable release artifacts.
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-with-symbols]
# Optimized native-debugging/profile build for Visual Studio.
# Do not use this profile for ordinary distribution artifacts.
inherits = "release"
debug = 2
strip = "none"
